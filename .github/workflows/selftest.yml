name: 自鸣棋自检

# 改了游戏(index.html)或网络/PWA 自检脚本，PR 阶段先跑；合入 main 后再复验。
# 让“游戏改坏了”在学生玩之前先被抓到（Pages 是 main push 即上线，本身不替我们做玩法验收）。
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'package.json'
      - 'selftest.mjs'
      - 'selftest-deadsave.mjs'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'edgeone.json'
      - 'tools/verify-release.mjs'
      - 'tools/selftest-pwa.mjs'
      - 'tools/qa-leaderboard-network.mjs'
      - 'assets/pwa-20260809/**'
  pull_request:
    paths:
      - 'index.html'
      - 'package.json'
      - 'selftest.mjs'
      - 'selftest-deadsave.mjs'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'edgeone.json'
      - 'tools/verify-release.mjs'
      - 'tools/selftest-pwa.mjs'
      - 'tools/qa-leaderboard-network.mjs'
      - 'assets/pwa-20260809/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i --no-save playwright@^1.48.0
      - run: npx playwright install --with-deps chromium
      - name: 跑 #selftest（自动读取总数 · 挂了就失败）
        run: node selftest.mjs
      - name: 验证命脉耗尽旧档不能复活重打
        run: node selftest-deadsave.mjs
      - name: 验证 PWA 在线接管与离线重开
        run: node tools/selftest-pwa.mjs
      - name: 验证排行榜弱网补传与切榜竞态
        run: node tools/qa-leaderboard-network.mjs
      - name: 校验 PWA、域名与网络边界
        run: node tools/verify-release.mjs
